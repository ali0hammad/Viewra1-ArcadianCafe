<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Universal AR Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: auto;
        }
        
        .title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }
        
        .btn {
            background: rgba(255,255,255,0.95);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-ar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(245, 87, 108, 0.6); }
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
        }
        
        .file-input-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 20px 40px;
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .file-label:hover {
            background: rgba(255,255,255,0.2);
            border-color: white;
        }
        
        .file-label svg {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            fill: currentColor;
        }
        
        .mode-indicator {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }
        
        .gesture-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            z-index: 2000;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        .hidden {
            display: none !important;
        }
        
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- WebXR Polyfill for non-certified devices -->
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    
    <!-- Model-Viewer as ultimate fallback -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <div id="loading-screen" class="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">Initializing AR Engine...</div>
    </div>

    <div id="container">
        <div id="canvas-container"></div>
        
        <div class="ui-layer">
            <div class="header">
                <div class="title">Universal AR Viewer</div>
                <div class="subtitle">Works on all Android devices</div>
            </div>
            
            <div id="mode-indicator" class="mode-indicator hidden">3D View Mode</div>
            
            <div id="file-input-wrapper" class="file-input-wrapper">
                <input type="file" id="file-input" class="file-input" accept=".glb,.gltf">
                <label for="file-input" class="file-label">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    <div>Tap to Load GLB File</div>
                    <div style="font-size: 12px; opacity: 0.8; margin-top: 5px;">or drop a file here</div>
                </label>
            </div>
            
            <div id="gesture-hint" class="gesture-hint hidden">
                Pinch to zoom • Drag to rotate • Two fingers to pan
            </div>
            
            <div id="controls" class="controls hidden">
                <button id="reset-btn" class="btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    Reset
                </button>
                <button id="ar-btn" class="btn btn-ar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Enter AR
                </button>
            </div>
        </div>
    </div>

    <div id="error-message" class="error-message">
        <h3>Error</h3>
        <p id="error-text"></p>
        <button onclick="this.parentElement.style.display='none'" style="margin-top: 15px; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer;">Close</button>
    </div>

    <script>
        // Initialize WebXR Polyfill immediately
        const polyfill = new WebXRPolyfill();
        
        class UniversalARViewer {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.model = null;
                this.xrSession = null;
                this.xrReferenceSpace = null;
                this.isARMode = false;
                this.glbBlobUrl = null;
                
                this.init();
            }
            
            async init() {
                try {
                    this.setupThreeJS();
                    this.setupEventListeners();
                    this.hideLoading();
                } catch (error) {
                    this.showError('Initialization failed: ' + error.message);
                }
            }
            
            setupThreeJS() {
                const container = document.getElementById('canvas-container');
                
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x667eea);
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    45, 
                    window.innerWidth / window.innerHeight, 
                    0.1, 
                    1000
                );
                this.camera.position.set(0, 1.5, 3);
                
                // Renderer with WebXR enabled
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true,
                    powerPreference: "high-performance"
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.xr.enabled = true;
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(this.renderer.domElement);
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);
                
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(5, 10, 7);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                this.scene.add(dirLight);
                
                const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
                fillLight.position.set(-5, 0, -5);
                this.scene.add(fillLight);
                
                // Controls
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.minDistance = 0.5;
                this.controls.maxDistance = 10;
                this.controls.target.set(0, 0.5, 0);
                
                // Animation loop
                this.renderer.setAnimationLoop(() => {
                    this.controls.update();
                    this.renderer.render(this.scene, this.camera);
                });
                
                // Handle resize
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            setupEventListeners() {
                // File input
                const fileInput = document.getElementById('file-input');
                fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                
                // Drag and drop
                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const files = e.dataTransfer.files;
                    if (files.length > 0) this.loadFile(files[0]);
                });
                
                // Buttons
                document.getElementById('reset-btn').addEventListener('click', () => this.resetView());
                document.getElementById('ar-btn').addEventListener('click', () => this.enterAR());
            }
            
            handleFileSelect(event) {
                const file = event.target.files[0];
                if (file) this.loadFile(file);
            }
            
            loadFile(file) {
                if (!file.name.match(/\.(glb|gltf)$/i)) {
                    this.showError('Please select a valid GLB or GLTF file');
                    return;
                }
                
                this.showLoading('Loading Model...');
                
                // Create blob URL for persistence
                if (this.glbBlobUrl) URL.revokeObjectURL(this.glbBlobUrl);
                this.glbBlobUrl = URL.createObjectURL(file);
                
                const loader = new THREE.GLTFLoader();
                loader.load(
                    this.glbBlobUrl,
                    (gltf) => this.onModelLoad(gltf),
                    (progress) => {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        document.querySelector('.loading-text').textContent = `Loading: ${percent}%`;
                    },
                    (error) => {
                        this.hideLoading();
                        this.showError('Failed to load model: ' + error.message);
                    }
                );
            }
            
            onModelLoad(gltf) {
                // Remove previous model
                if (this.model) {
                    this.scene.remove(this.model);
                }
                
                this.model = gltf.scene;
                
                // Center and scale model
                const box = new THREE.Box3().setFromObject(this.model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 1.5 / maxDim;
                this.model.scale.setScalar(scale);
                
                this.model.position.x = -center.x * scale;
                this.model.position.y = -center.y * scale + (size.y * scale / 2);
                this.model.position.z = -center.z * scale;
                
                this.model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                this.scene.add(this.model);
                
                // Update UI
                document.getElementById('file-input-wrapper').classList.add('hidden');
                document.getElementById('controls').classList.remove('hidden');
                document.getElementById('mode-indicator').classList.remove('hidden');
                document.getElementById('gesture-hint').classList.remove('hidden');
                
                this.hideLoading();
                this.resetView();
            }
            
            async enterAR() {
                if (!this.model) return;
                
                // Strategy 1: Try WebXR with polyfill (works on most Android devices)
                if ('xr' in navigator) {
                    try {
                        const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
                        if (isSupported) {
                            await this.startWebXR();
                            return;
                        }
                    } catch (e) {
                        console.log('WebXR not supported, trying fallback...');
                    }
                }
                
                // Strategy 2: Try WebXR with inline session (works on more devices)
                try {
                    await this.startInlineAR();
                    return;
                } catch (e) {
                    console.log('Inline AR failed, trying Scene Viewer...');
                }
                
                // Strategy 3: Google Scene Viewer (universal Android support)
                this.openSceneViewer();
            }
            
            async startWebXR() {
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test', 'dom-overlay'],
                    domOverlay: { root: document.getElementById('ui-layer') },
                    optionalFeatures: ['light-estimation']
                });
                
                this.xrSession = session;
                this.isARMode = true;
                
                const gl = this.renderer.getContext();
                await gl.makeXRCompatible();
                
                this.renderer.xr.setSession(session);
                
                const referenceSpace = await session.requestReferenceSpace('local-floor');
                this.xrReferenceSpace = referenceSpace;
                
                // Hide 3D controls
                document.getElementById('controls').classList.add('hidden');
                document.getElementById('gesture-hint').classList.add('hidden');
                document.getElementById('mode-indicator').textContent = 'AR Mode - Tap to place';
                
                // Handle hit test for placing object
                const viewerSpace = await session.requestReferenceSpace('viewer');
                const hitTestSource = await session.requestHitTestSource({
                    space: viewerSpace
                });
                
                let placed = false;
                
                session.addEventListener('select', () => {
                    if (!placed && this.model) {
                        placed = true;
                        document.getElementById('mode-indicator').textContent =
